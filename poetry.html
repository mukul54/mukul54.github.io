<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetry - Mukul Ranjan</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            font-size: 18px;
            line-height: 1.8;
            color: #333;
            margin: 0;
            padding: 0;
            background: #f5f0eb;
        }

        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        .back-link {
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
            margin-bottom: 40px;
            display: inline-block;
        }

        .back-link:hover {
            color: #333;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 50px;
        }

        .shelf {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 48px 40px;
        }

        .book {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .cover {
            position: relative;
            aspect-ratio: 2 / 3;
            background: #ddd url('static/cover_swapn-aur-uchchhwas.jpg') center / cover no-repeat;
            border-radius: 3px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18), 0 1px 2px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .book:hover .cover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24), 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .cover-text {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 48px 18px 22px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.85) 35%, rgba(255, 255, 255, 0.96) 100%);
        }

        .cover-text .title {
            font-size: 1.55em;
            line-height: 1.3;
            color: #222;
        }

        .cover-text .sub {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
            line-height: 1.5;
        }

        .cover-text .author {
            font-size: 0.85em;
            color: #444;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        .book-meta {
            margin-top: 16px;
        }

        .book-meta .name {
            font-size: 1.1em;
            color: #222;
        }

        .book-meta .desc {
            font-size: 0.9em;
            color: #666;
            line-height: 1.5;
            margin-top: 2px;
        }

        .book:hover .book-meta .name {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="content">
        <a href="index.html" class="back-link">&larr; Back to Home</a>

        <h1>Poetry</h1>
        <p class="subtitle">कविताएँ</p>

        <div class="shelf">
            <a class="book" href="poetry/swapn-aur-uchchhwas.html">
                <div class="cover">
                    <div class="cover-text">
                        <div class="title">स्वप्न और उच्छ्वास</div>
                        <div class="sub">कविताएँ</div>
                        <div class="author">मुकुल रंजन</div>
                    </div>
                </div>
                <div class="book-meta">
                    <div class="name">स्वप्न और उच्छ्वास</div>
                    <div class="desc">Hindi poems, mostly from my school days.</div>
                </div>
            </a>

            <a class="book" href="poetry/dream-and-sigh.html">
                <div class="cover">
                    <div class="cover-text">
                        <div class="title">Dream and Sigh</div>
                        <div class="sub"><em>Swapn aur Uchchhwas</em><br>Poems, translated from the Hindi</div>
                        <div class="author">Mukul Ranjan</div>
                    </div>
                </div>
                <div class="book-meta">
                    <div class="name">Dream and Sigh</div>
                    <div class="desc">English translation of स्वप्न और उच्छ्वास, by Claude Opus 5.5.</div>
                </div>
            </a>
        </div>
    </div>

    <script data-goatcounter="https://mukulranjan.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
